<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>AnkillousJ AWT — running in the browser</title>
<style>
  body { background:#0d0e1c; color:#e8e9f3; font:14px/1.5 system-ui,sans-serif; margin:0; padding:32px; }
  h1 { font-size:18px; font-weight:600; margin:0 0 4px; color:#e6c878; }
  p { color:#a096be; margin:0 0 24px; max-width:60ch; }
  canvas { border:1px solid #2c3155; border-radius:6px; display:block; }
  #log { margin-top:20px; font-family:ui-monospace,monospace; font-size:12px; color:#8a8fb5; white-space:pre-wrap; }
  .row { display:flex; gap:32px; flex-wrap:wrap; align-items:flex-start; }
</style>
</head>
<body>
  <h1>RoomInfoCard + GroupIcon — — unmodified drawing code, in a browser tab</h1>
  <p>Java &rarr; javac &rarr; TeaVM &rarr; JavaScript, with <code>Graphics2D</code> backed by Canvas2D.</p>
  <div class="row">
    <canvas id="c" width="420" height="140"></canvas>
    <div id="log">loading...</div>
  </div>
<script src="proof.js"></script>
<script>
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');

  // AWT renders at native display resolution; canvas needs telling.
  const dpr = window.devicePixelRatio || 1;
  const cssW = canvas.width, cssH = canvas.height;
  canvas.width  = Math.round(cssW * dpr);
  canvas.height = Math.round(cssH * dpr);
  canvas.style.width  = cssW + 'px';
  canvas.style.height = cssH + 'px';
  ctx.scale(dpr, dpr);

  const counts = {};
  const traced = new Proxy(ctx, {
    get(t, p) { const v = t[p];
      return typeof v === 'function'
        ? (...a) => { counts[p] = (counts[p]||0)+1; return v.apply(t, a); }
        : v; },
    set(t, p, v) { counts['set:'+p] = (counts['set:'+p]||0)+1; t[p] = v; return true; }
  });

  const lines = [];
  globalThis.__ankCtx = traced;
  globalThis.__ankLog = m => lines.push(m);

  main([]);

  const total = Object.values(counts).reduce((a,b)=>a+b,0);
  document.getElementById('log').textContent =
    lines.join('\n') + '\n\ndevicePixelRatio ' + dpr +
    '\n' + total + ' Canvas2D operations\n' +
    Object.entries(counts).sort((a,b)=>b[1]-a[1])
      .map(([k,v]) => '  ' + k.padEnd(22) + v).join('\n');
</script>
</body>
</html>
